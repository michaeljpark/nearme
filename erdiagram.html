<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER Diagram - Proximity Deals Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: #f4f4f4;
            color: #171717;
            font-family: "Poppins", Arial, sans-serif;
            letter-spacing: -0.02em;
        }

        body {
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .slide {
            width: min(96vw, 1440px);
            aspect-ratio: 16 / 8.3;
            background: #ffffff;
            border: 1px solid #d7d7d7;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        text {
            font-family: "Poppins", Arial, sans-serif;
            letter-spacing: -0.02em;
        }

        .page-title {
            fill: #171717;
            font-size: 29px;
            font-weight: 700;
        }

        .page-subtitle {
            fill: #525252;
            font-size: 13px;
            font-weight: 400;
        }

        .section {
            fill: #525252;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .entity-card {
            fill: #ffffff;
            stroke: #171717;
            stroke-width: 0.8;
        }

        .entity-head {
            fill: #f2f2f2;
            stroke: #171717;
            stroke-width: 0.8;
        }

        .entity-title {
            fill: #171717;
            font-size: 13px;
            font-weight: 700;
        }

        .field {
            fill: #262626;
            font-size: 10.5px;
            font-weight: 400;
        }

        .field-key {
            fill: #171717;
            font-size: 10.5px;
            font-weight: 700;
        }

        .field-muted {
            fill: #606060;
            font-size: 9.8px;
            font-weight: 400;
        }

        .relationship {
            fill: none;
            stroke: #171717;
            stroke-width: 0.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .relationship-light {
            fill: none;
            stroke: #8c8c8c;
            stroke-width: 0.65;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 5 5;
        }

        .rel-label {
            fill: #404040;
            font-size: 9.5px;
            font-weight: 600;
        }

        .note-box {
            fill: #fafafa;
            stroke: #cfcfcf;
            stroke-width: 0.7;
        }

        .note-title {
            fill: #171717;
            font-size: 11px;
            font-weight: 700;
        }

        .note-text {
            fill: #525252;
            font-size: 9.5px;
            font-weight: 400;
        }
    </style>
</head>
